name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - run: python -m unittest discover -s tests -v

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/cloudcruise/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "cloudcruise $VERSION already on PyPI, skipping publish"
          elif [ "$STATUS" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "PyPI version check returned HTTP $STATUS"
            exit 1
          fi

      - name: Build distributions
        if: steps.check.outputs.publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --generate-notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
